name: Streamly CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: streamly-backend-ecr
  AWS_ACCOUNT_ID: "516737672784"
  AWS_ROLE_ARN: arn:aws:iam::516737672784:role/StreamlyGitHubActionsRole
  ASG_NAME: streamly-backend-asg

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
            ./backend

      - name: Tag Docker image
        run: |
          docker tag \
            ${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Push Docker image
        run: |
          docker push \
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Get current ASG instances
        id: instances
        run: |
          INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "${{ env.ASG_NAME }}" \
            --query 'AutoScalingGroups[0].Instances[?LifecycleState==`InService`].InstanceId' \
            --output text)

          if [ -z "$INSTANCE_IDS" ]; then
            echo "No InService instances found."
            exit 1
          fi

          echo "Instances: $INSTANCE_IDS"
          echo "instance_ids=$INSTANCE_IDS" >> "$GITHUB_OUTPUT"

      - name: Deploy to EC2 through SSM
        id: deploy
        run: |
          IMAGE_URI="${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids ${{ steps.instances.outputs.instance_ids }} \
            --document-name "AWS-RunShellScript" \
            --comment "Streamly deployment ${{ github.sha }}" \
            --parameters "commands=[\"sudo /opt/streamly/deploy.sh $IMAGE_URI\"]" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment
        run: |
          COMMAND_ID="${{ steps.deploy.outputs.command_id }}"
          INSTANCE_IDS="${{ steps.instances.outputs.instance_ids }}"

          for INSTANCE_ID in $INSTANCE_IDS; do
            echo "Waiting for deployment on $INSTANCE_ID..."

            aws ssm wait command-executed \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID"

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text)

            echo "$INSTANCE_ID deployment status: $STATUS"

            if [ "$STATUS" != "Success" ]; then
              echo "Deployment failed on $INSTANCE_ID"

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
                --output json

              exit 1
            fi
          done

          echo "Deployment succeeded on all instances."
